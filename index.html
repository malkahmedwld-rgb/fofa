<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طيبة الأثر | فوفانا</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        
        <aside class="islamic-sidebar">
            <div class="pattern-overlay"></div>
            <div class="sidebar-content">
                <div class="logo-area">
                    <h1>طيبة الأثر</h1>
                    <h2>فوفانا</h2>
                </div>
                <nav class="side-nav">
                    <a href="#hero" class="active"><i class="fas fa-home"></i> الرئيسية</a>
                    <a href="#quran"><i class="fas fa-quran"></i> القرآن (ورش)</a>
                    <a href="#radio"><i class="fas fa-broadcast-tower"></i> الإذاعة</a>
                    <a href="#tasbih"><i class="fas fa-fingerprint"></i> المسبحة</a>
                    <a href="#athkar"><i class="fas fa-hands-praying"></i> الأذكار</a>
                </nav>
            </div>
        </aside>

        <main class="content-area">
            
            <header class="top-header">
                <div class="user-welcome">
                    <h3>صدقة جارية</h3>
                    <p>الفتاة التي وضعت بصمة خير عند إخوتها</p>
                </div>
                <div class="date-display" id="dateDisplay">
                    </div>
            </header>

            <div class="scroll-container">
                
                <section id="radio" class="card golden-card">
                    <div class="card-header">
                        <i class="fas fa-microphone-alt"></i>
                        <h3>إذاعة القرآن المباشرة</h3>
                    </div>
                    <div class="radio-controls">
                        <div class="select-wrapper">
                            <select id="readerSelect">
                                <option value="" disabled selected>-- اختر القارئ --</option>
                                <option value="https://backup.qurango.net/radio/yasser_aldosari">ياسر الدوسري</option>
                                <option value="https://backup.qurango.net/radio/maher">ماهر المعيقلي</option>
                                <option value="https://backup.qurango.net/radio/abdulbasit_uj">عبدالباسط (ورش)</option>
                                <option value="https://backup.qurango.net/radio/alkouchi">العيون الكوشي (ورش)</option>
                            </select>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="player-actions">
                            <button id="playBtn" class="play-btn"><i class="fas fa-play"></i></button>
                            <div class="wave-visualizer">
                                <span></span><span></span><span></span><span></span><span></span>
                            </div>
                            <p id="radioStatus">جاهز للتشغيل</p>
                        </div>
                        <audio id="audioPlayer" hidden></audio>
                    </div>
                </section>

                <section id="tasbih" class="card white-card">
                    <div class="card-header dark">
                        <h3>المسبحة الإلكترونية</h3>
                    </div>
                    <div class="tasbih-body">
                        <div class="lcd-screen">
                            <span id="tasbihCount">000</span>
                        </div>
                        <div class="tasbih-buttons">
                            <button id="countBtn" class="main-tasbih-btn">سبحان الله</button>
                            <button id="resetBtn" class="small-btn" title="تصفير"><i class="fas fa-redo"></i></button>
                        </div>
                    </div>
                </section>

                <section id="athkar" class="athkar-grid">
                    </section>

                <section id="quran" class="card white-card">
                    <div class="card-header dark">
                        <h3>فهرس المصحف (رواية ورش)</h3>
                    </div>
                    <div class="surah-list" id="surahList">
                        </div>
                </section>

            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
