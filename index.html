<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طيبة الأثر | فوفانا - صدقة جارية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           1. أساسيات التصميم (Global Reset & Vars)
           ========================================= */
        :root {
            --primary-dark: #0f2027;   /* كحلي غامق */
            --primary-light: #203a43;  /* تركواز غامق */
            --gold: #d4af37;           /* ذهبي فاخر */
            --gold-light: #f3e5ab;     /* ذهبي فاتح للخلفيات */
            --white: #ffffff;
            --bg-cream: #fdfbf7;       /* أبيض كريمي */
            --text-main: #2c3e50;
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-main);
            overflow-x: hidden;
            direction: rtl;
        }

        /* شريط التمرير المخصص */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

        /* =========================================
           2. الهيكل الرئيسي (Layout)
           ========================================= */
        .app-container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* زر القائمة للموبايل */
        .mobile-toggle {
            display: none;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: var(--gold);
            border: none;
            color: var(--primary-dark);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* =========================================
           3. القائمة الجانبية (Sidebar)
           ========================================= */
        .sidebar {
            width: 280px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            color: var(--white);
            display: flex;
            flex-direction: column;
            padding: 2rem;
            position: sticky;
            top: 0;
            height: 100vh;
            box-shadow: 5px 0 20px rgba(0,0,0,0.15);
            z-index: 999;
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        /* نقش إسلامي شفاف في الخلفية */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(var(--gold) 15%, transparent 16%),
                              radial-gradient(var(--gold) 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            opacity: 0.05;
            pointer-events: none;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
            z-index: 2;
        }

        .logo-section h1 {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .logo-section p {
            font-family: 'Amiri', serif;
            color: var(--gold-light);
            font-size: 1.1rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 2;
        }

        .nav-links li a {
            text-decoration: none;
            color: rgba(255,255,255,0.8);
            font-size: 1.1rem;
            padding: 12px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .nav-links li a:hover, .nav-links li a.active {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            border-right: 4px solid var(--gold);
            padding-right: 16px; /* حركة بسيطة */
        }

        .nav-links li a i { width: 25px; text-align: center; }

        /* =========================================
           4. منطقة المحتوى (Main Content)
           ========================================= */
        .main-content {
            flex: 1;
            padding: 2rem;
            background-image: linear-gradient(var(--white) 50%, var(--bg-cream) 50%);
            background-size: 100% 50px; /* خطوط خفيفة جداً */
            overflow-y: auto;
        }

        .header-welcome {
            margin-bottom: 2rem;
            background: var(--white);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold);
        }

        .welcome-text h2 {
            font-family: 'Amiri', serif;
            color: var(--primary-dark);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .welcome-text span {
            color: #777;
            font-size: 1rem;
        }

        .hijri-date {
            background: var(--gold-light);
            color: var(--primary-dark);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-family: 'Amiri', serif;
        }

        /* =========================================
           5. البطاقات والأقسام (Cards)
           ========================================= */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .card-header i {
            font-size: 1.5rem;
            color: var(--gold);
            background: var(--primary-dark);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .card-header h3 {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            color: var(--primary-dark);
        }

        /* --- تصميم مشغل الصوت (الإذاعة) --- */
        .radio-box {
            text-align: center;
        }
        
        .custom-select-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--gold-light);
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            appearance: none;
            background: #fff;
            cursor: pointer;
        }

        .player-controls {
            background: linear-gradient(to right, var(--primary-dark), var(--primary-light));
            padding: 20px;
            border-radius: 15px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gold);
            border: none;
            color: var(--primary-dark);
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .play-btn:hover { transform: scale(1.1); }
        
        .status-text { font-size: 0.9rem; opacity: 0.8; }

        /* --- تصميم المسبحة --- */
        .tasbih-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .counter-screen {
            font-family: 'Courier New', monospace;
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--primary-dark);
            background: var(--gold-light);
            padding: 10px 40px;
            border-radius: 10px;
            border: 2px solid var(--gold);
            box-shadow: inset 0 3px 10px rgba(0,0,0,0.1);
            min-width: 180px;
            text-align: center;
        }

        .tasbih-btn-main {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle at 30% 30%, var(--gold), #b8962e);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            font-family: 'Amiri', serif;
        }

        .tasbih-btn-main:active { transform: scale(0.95); }

        .reset-icon {
            cursor: pointer;
            color: #777;
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .reset-icon:hover { color: red; transform: rotate(180deg); }

        /* --- شبكة الأذكار --- */
        .athkar-section h3 {
            font-family: 'Amiri', serif;
            color: var(--gold);
            font-size: 1.8rem;
            margin: 2rem 0 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .athkar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .thikr-card {
            background: white;
            border: 1px solid #eee;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .thikr-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 0%; height: 3px;
            background: var(--gold);
            transition: 0.3s;
        }

        .thikr-card:hover::after { width: 100%; }
        
        .thikr-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: #fffcf5;
        }

        .thikr-card p {
            font-family: 'Amiri', serif;
            font-size: 1.2rem;
            color: var(--primary-light);
            line-height: 1.6;
        }

        /* --- قائمة السور --- */
        .surah-list {
            max-height: 400px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            padding-right: 5px;
        }

        .surah-item {
            background: #f8f9fa;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-family: 'Amiri', serif;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .surah-item:hover {
            background: var(--primary-dark);
            color: var(--gold);
            border-color: var(--primary-dark);
        }

        .surah-number {
            font-size: 0.8rem;
            background: #eee;
            width: 20px; height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        /* =========================================
           6. التجاوب مع الجوال (Responsive)
           ========================================= */
        @media (max-width: 992px) {
            .mobile-toggle { display: block; }
            
            .sidebar {
                position: fixed;
                left: 0; top: 0;
                transform: translateX(100%); /* إخفاء لليمين لأن الموقع RTL */
                width: 80%;
                max-width: 300px;
                right: 0;
                left: auto;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .header-welcome {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .main-content {
                padding: 1rem;
                padding-top: 60px; /* مسافة للزر */
            }
        }
    </style>
</head>
<body>

    <button class="mobile-toggle" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <div class="app-container">
        
        <aside class="sidebar" id="sidebar">
            <div class="logo-section">
                <h1>طيبة الأثر</h1>
                <p>صدقة جارية عن فوفانا</p>
            </div>
            <ul class="nav-links">
                <li><a href="#" class="active"><i class="fas fa-home"></i> الرئيسية</a></li>
                <li><a href="#quran"><i class="fas fa-quran"></i> القرآن (ورش)</a></li>
                <li><a href="#radio"><i class="fas fa-broadcast-tower"></i> الإذاعة</a></li>
                <li><a href="#tasbih"><i class="fas fa-fingerprint"></i> المسبحة</a></li>
                <li><a href="#athkar"><i class="fas fa-hands-praying"></i> الأذكار</a></li>
            </ul>
        </aside>

        <main class="main-content">
            
            <div class="header-welcome">
                <div class="welcome-text">
                    <h2>أهلاً بك في طيبة الأثر</h2>
                    <span>الفتاة التي وضعت بصمة خير عند إخوتها</span>
                </div>
                <div class="hijri-date" id="hijriDate">
                    1445 هـ
                </div>
            </div>

            <div class="grid-container">
                
                <div class="card" id="radio">
                    <div class="card-header">
                        <i class="fas fa-microphone-alt"></i>
                        <h3>إذاعة القرآن المباشرة</h3>
                    </div>
                    <div class="radio-box">
                        <div class="custom-select-wrapper">
                            <select id="readerSelect">
                                <option value="" disabled selected>-- اختر القارئ المفضل --</option>
                                <option value="https://backup.qurango.net/radio/yasser_aldosari">ياسر الدوسري</option>
                                <option value="https://backup.qurango.net/radio/maher">ماهر المعيقلي</option>
                                <option value="https://backup.qurango.net/radio/abdulbasit_uj">عبدالباسط (ورش عن نافع)</option>
                                <option value="https://backup.qurango.net/radio/alkouchi">العيون الكوشي (ورش)</option>
                                <option value="https://backup.qurango.net/radio/mohammad_altablaway">محمد الطبلاوي</option>
                            </select>
                        </div>
                        <div class="player-controls">
                            <div class="info">
                                <p style="margin-bottom:5px; font-weight:bold;">حالة البث:</p>
                                <span id="radioStatus" class="status-text">متوقف</span>
                            </div>
                            <button id="playBtn" class="play-btn"><i class="fas fa-play"></i></button>
                        </div>
                        <audio id="audioPlayer" hidden></audio>
                    </div>
                </div>

                <div class="card" id="tasbih">
                    <div class="card-header">
                        <i class="fas fa-ring"></i>
                        <h3>المسبحة الإلكترونية</h3>
                    </div>
                    <div class="tasbih-wrapper">
                        <div class="counter-screen" id="tasbihCounter">000</div>
                        <button class="tasbih-btn-main" id="incrementBtn">سبحان الله</button>
                        <div class="reset-icon" id="resetBtn" title="تصفير العداد">
                            <i class="fas fa-redo-alt"></i> تصفير
                        </div>
                    </div>
                </div>
            </div>

            <div class="athkar-section" id="athkar">
                <h3><i class="fas fa-moon"></i> أذكار مأثورة</h3>
                <div class="athkar-grid" id="athkarContainer">
                    </div>
            </div>

            <br><br>

            <div class="card" id="quran">
                <div class="card-header">
                    <i class="fas fa-book-open"></i>
                    <h3>فهرس المصحف الشريف (رواية ورش)</h3>
                </div>
                <div class="surah-list" id="surahContainer">
                    </div>
            </div>

        </main>
    </div>

    <script>
        // 1. القائمة الجانبية للموبايل
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // 2. التاريخ الهجري
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', calendar: 'islamic-umalqura' };
        document.getElementById('hijriDate').innerText = new Date().toLocaleDateString('ar-SA', dateOptions);

        // 3. مشغل الإذاعة
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const select = document.getElementById('readerSelect');
        const status = document.getElementById('radioStatus');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if(!select.value) {
                alert('الرجاء اختيار القارئ أولاً');
                return;
            }
            
            if(isPlaying) {
                audio.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                status.innerText = "متوقف مؤقتاً";
                status.style.color = "#eee";
                isPlaying = false;
            } else {
                audio.src = select.value;
                audio.play();
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                status.innerText = "جاري الاستماع مباشر...";
                status.style.color = "#d4af37";
                isPlaying = true;
            }
        });

        select.addEventListener('change', () => {
            if(isPlaying) {
                audio.src = select.value;
                audio.play();
            }
        });

        // 4. المسبحة
        let count = 0;
        const counterDisplay = document.getElementById('tasbihCounter');
        
        document.getElementById('incrementBtn').addEventListener('click', () => {
            count++;
            counterDisplay.innerText = count.toString().padStart(3, '0');
            // اهتزاز خفيف للموبايل
            if(navigator.vibrate) navigator.vibrate(30);
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if(confirm('هل تريد تصفير العداد؟')) {
                count = 0;
                counterDisplay.innerText = "000";
            }
        });

        // 5. توليد الأذكار
        const athkarData = [
            "سبحان الله وبحمده", "سبحان الله العظيم", 
            "لا إله إلا الله وحد لا شريك له", "أستغفر الله وأتوب إليه",
            "اللهم صل وسلم على نبينا محمد", "لا حول ولا قوة إلا بالله",
            "سبحان الله والحمد لله ولا إله إلا الله والله أكبر", "حسبي الله ونعم الوكيل"
        ];
        
        const athkarContainer = document.getElementById('athkarContainer');
        athkarData.forEach(text => {
            const div = document.createElement('div');
            div.className = 'thikr-card';
            div.innerHTML = `<p>${text}</p>`;
            div.onclick = function() {
                this.style.background = "#d4af37";
                this.querySelector('p').style.color = "#fff";
                setTimeout(() => {
                    this.style.background = "#fff";
                    this.querySelector('p').style.color = "";
                }, 300);
            }
            athkarContainer.appendChild(div);
        });

        // 6. توليد سور القرآن
        const surahNames = ["الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس", "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه", "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم", "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر", "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق", "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة", "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج", "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس", "التكوير", "الإنفطار", "المطففين", "الإنشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد", "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات", "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر", "المسد", "الإخلاص", "الفلق", "الناس"];

        const surahContainer = document.getElementById('surahContainer');
        surahNames.forEach((name, i) => {
            const div = document.createElement('div');
            div.className = 'surah-item';
            div.innerHTML = `<span class="surah-number">${i+1}</span> ${name}`;
            div.onclick = () => alert('سيتم فتح سورة ' + name + ' برواية ورش');
            surahContainer.appendChild(div);
        });

    </script>
</body>
</html>
